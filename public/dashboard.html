<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kayal Saathi Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { height: 100dvh; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 96px; }
    .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .stat span { font-size: .72rem; color: var(--muted); }
    .stat.alert b { color: var(--danger); }
    .layout { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
    aside { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding: 12px; }
    #map { height: 100%; min-height: 320px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 10px; font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; }
    .chip[aria-pressed="false"] { opacity: .45; }
    .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .item:hover { border-color: var(--brand); border-left-color: var(--c); }
    .item.new { animation: flash 2.5s ease-out; }
    @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); } 100% { background: var(--surface); } }
    .item h3 { font-size: .95rem; margin: 0 0 2px; }
    .item .meta { font-size: .75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: .7rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
    .badge.open { color: var(--danger); } .badge.in_progress { color: #b45309; } .badge.resolved { color: #15803d; }
    .popup img { width: 100%; border-radius: 8px; margin: 6px 0; }
    .popup .ml { font-size: .95rem; }
    .popup select { margin-top: 6px; width: 100%; padding: 4px; }
    .leaflet-popup-content { width: 260px !important; }
    .sample { font-size: .65rem; color: var(--muted); }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 50vh auto; }
      aside { order: 2; border-right: 0; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img class="logo" src="/favicon.svg" alt="" />
      <div><h1>Kayal Saathi · Authority Dashboard</h1><p>Live citizen reports from Alappuzha backwaters</p></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-open">0</b><span>Open reports</span></div>
      <div class="stat alert"><b id="s-high">0</b><span>High severity (4–5)</span></div>
      <div class="stat"><b id="s-24h">0</b><span>Last 24 hours</span></div>
      <div class="stat"><b id="s-lang">0</b><span>Languages heard</span></div>
    </div>
  </div>
  <div class="layout">
    <aside>
      <div class="filters" id="cat-filters"></div>
      <div class="filters" id="status-filters"></div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
